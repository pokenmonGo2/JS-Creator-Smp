<!DOCTYPE html><html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Players | My SMP</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07110b;
      color: white;
      min-height: 100vh;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 7%;
      background: rgba(5, 15, 9, 0.95);
      border-bottom: 1px solid #183d23;
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #58e47b;
    }

    nav a {
      color: #b9c9be;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
      transition: 0.2s;
    }

    nav a:hover {
      color: #58e47b;
    }

    header {
      text-align: center;
      padding: 70px 20px 35px;
    }

    header h1 {
      font-size: clamp(38px, 8vw, 70px);
      margin-bottom: 12px;
    }

    header p {
      color: #9caf9f;
      font-size: 17px;
    }

    .controls {
      width: min(1100px, 90%);
      margin: 10px auto 35px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    input,
    select {
      flex: 1;
      min-width: 180px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #244b2e;
      background: #0d1c12;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      border-color: #58e47b;
    }

    .players {
      width: min(1100px, 90%);
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
      padding-bottom: 60px;
    }

    .player {
      background: linear-gradient(145deg, #0d1c12, #09150d);
      border: 1px solid #1c4025;
      border-radius: 18px;
      padding: 24px;
      transition: 0.25s;
    }

    .player:hover {
      transform: translateY(-5px);
      border-color: #58e47b;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .skin {
      width: 90px;
      height: 90px;
      margin: 0 auto 18px;
      border-radius: 14px;
      background: #18291d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      border: 1px solid #315c3b;
    }

    .player h2 {
      text-align: center;
      margin-bottom: 5px;
    }

    .team {
      text-align: center;
      color: #8fa995;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      background: #08130c;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 20px;
      margin-bottom: 3px;
    }

    .stat span {
      color: #839488;
      font-size: 12px;
    }

    .status {
      margin-top: 15px;
      text-align: center;
      padding: 8px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: bold;
    }

    .alive {
      background: rgba(45, 180, 82, 0.15);
      color: #58e47b;
    }

    .dead {
      background: rgba(220, 70, 70, 0.15);
      color: #ff7777;
    }

    #noResults {
      display: none;
      text-align: center;
      color: #89988d;
      padding: 30px;
      width: 100%;
    }

    footer {
      text-align: center;
      padding: 30px;
      border-top: 1px solid #183d23;
      color: #718075;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      nav {
        padding: 15px 5%;
      }

      nav div:last-child {
        display: flex;
        gap: 8px;
      }

      nav a {
        margin-left: 5px;
        font-size: 12px;
      }

      header {
        padding-top: 50px;
      }

      .controls {
        width: 90%;
      }

      input,
      select {
        width: 100%;
      }
    }
  </style></head><body>  <nav>
    <div class="logo">MY SMP</div><div>
  <a href="index.html">Home</a>
  <a href="players.html">Players</a>
  <a href="timeline.html">Timeline</a>
  <a href="lore.html">Lore</a>
  <a href="map.html">Map</a>
</div>

  </nav>  <header>
    <h1>PLAYERS</h1>
    <p>Bekijk alle spelers en hun SMP-statistieken.</p>
  </header>  <section class="controls"><input
  type="text"
  id="search"
  placeholder="🔎 Zoek een speler..."
>

<select id="statusFilter">
  <option value="all">Alle spelers</option>
  <option value="alive">Alive</option>
  <option value="dead">Dead</option>
</select>

<select id="teamFilter">
  <option value="all">Alle teams</option>
  <option value="north">North</option>
  <option value="south">South</option>
  <option value="solo">Solo</option>
</select>

  </section>  <section class="players" id="players"><div class="player" data-name="jorn" data-status="alive" data-team="north">
  <div class="skin">🧑‍🌾</div>

  <h2>Jorn</h2>
  <div class="team">North</div>

  <div class="stats">
    <div class="stat">
      <strong>18</strong>
      <span>Kills</span>
    </div>

    <div class="stat">
      <strong>4</strong>
      <span>Deaths</span>
    </div>
  </div>

  <div class="status alive">● ALIVE</div>
</div>


<div class="player" data-name="sem" data-status="alive" data-team="south">
  <div class="skin">🧑‍🎤</div>

  <h2>Sem</h2>
  <div class="team">South</div>

  <div class="stats">
    <div class="stat">
      <strong>15</strong>
      <span>Kills</span>
    </div>

    <div class="stat">
      <strong>7</strong>
      <span>Deaths</span>
    </div>
  </div>

  <div class="status alive">● ALIVE</div>
</div>


<div class="player" data-name="player 3" data-status="dead" data-team="solo">
  <div class="skin">🧟</div>

  <h2>Player 3</h2>
  <div class="team">Solo</div>

  <div class="stats">
    <div class="stat">
      <strong>14</strong>
      <span>Kills</span>
    </div>

    <div class="stat">
      <strong>20</strong>
      <span>Deaths</span>
    </div>
  </div>

  <div class="status dead">● DEAD</div>
</div>

<div id="noResults">
  Geen spelers gevonden.
</div>

  </section>  <footer>
    MY SMP • Season 1
  </footer>  <script>

    const search = document.getElementById("search");
    const statusFilter = document.getElementById("statusFilter");
    const teamFilter = document.getElementById("teamFilter");

    const playerCards = document.querySelectorAll(".player");
    const noResults = document.getElementById("noResults");


    function filterPlayers() {

      const searchValue = search.value.toLowerCase();
      const statusValue = statusFilter.value;
      const teamValue = teamFilter.value;

      let visiblePlayers = 0;

      playerCards.forEach(player => {

        const name = player.dataset.name;
        const status = player.dataset.status;
        const team = player.dataset.team;

        const matchesSearch =
          name.includes(searchValue);

        const matchesStatus =
          statusValue === "all" ||
          status === statusValue;

        const matchesTeam =
          teamValue === "all" ||
          team === teamValue;

        if (
          matchesSearch &&
          matchesStatus &&
          matchesTeam
        ) {
          player.style.display = "block";
          visiblePlayers++;
        } else {
          player.style.display = "none";
        }

      });

      noResults.style.display =
        visiblePlayers === 0 ? "block" : "none";
    }


    search.addEventListener("input", filterPlayers);
    statusFilter.addEventListener("change", filterPlayers);
    teamFilter.addEventListener("change", filterPlayers);

  </script></body>
</html>
